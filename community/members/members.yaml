# Cloud Native Karachi members. See ../governance/membership.md before editing.
# Entries are added by pull request after a membership request has been reviewed.
#
# Never add a phone number, email address, Slack handle or WhatsApp name. Those
# are verification details and they stay in the request issue.
#
# `name`, `linkedin` and `org` are optional. A handle-only listing is fully
# supported.

# Membership phase. See ../governance/membership.md#founding-phase.
# Flip to `steady` when events_held reaches 3 AND there are 10 members.
phase: founding

# Total events held, all time. Bumped by the pull request closing each retro.
events_held: 0

