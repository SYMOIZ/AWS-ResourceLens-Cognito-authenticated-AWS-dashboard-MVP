# Former Members and organizers. See ../governance/membership.md#inactivity-and-emeritus.
#
# Being here carries no negative meaning; the common reason is running out of
# time. Returning needs 1 contribution unit and 1 sponsor.
#
# Entries never carry a reason. Someone who left after a Code of Conduct
# decision looks identical to someone who moved city, because the alternative is
# a permanent public punishment we did not decide to impose. The private record
# lives in the group credential store.

# Schema reference.
#
# emeritus:
#   - name: ABC BIN XYZ
#     github: abcbinxyz
#     was: member          # member | sig-lead | organizer
#     since: 2026-09-15    # when they took the role
#     until: 2028-01-31    # when they left it
#     sigs: [sig-platform]

emeritus: []
