services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      APP_ENV: development
      DEMO_MODE: "true"
      AI_PROVIDER: demo
      DATABASE_URL: sqlite:////app/data/infrapulse.db
      SCHEDULER_ENABLED: "true"
      SCHEDULE_TIME: "09:00"
      TIMEZONE: UTC
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
    volumes:
      - infrapulse-data:/app/data

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    environment:
      VITE_PROXY_TARGET: http://backend:8000
    depends_on:
      - backend

volumes:
  infrapulse-data:
